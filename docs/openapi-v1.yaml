openapi: 3.1.0
info:
  title: AirTrail API v1
  version: 1.0.0
  description: >-
    The versioned public API for AirTrail integrations and custom clients.
    OAuth access tokens and personal API keys use the same bearer header.
    Credential scopes are a ceiling over the user's current RBAC permissions.
servers:
  - url: '{protocol}://{domain}'
    description: Your AirTrail instance.
    variables:
      protocol:
        enum: [http, https]
        default: https
      domain:
        default: your-instance.example
  - url: https://example-instance.com
    description: Example AirTrail instance.
security:
  - bearerAuth: []
tags:
  - { name: Discovery, description: API metadata and the connected identity. }
  - { name: Flights, description: Flights, tracks, exports, and statistics. }
  - { name: Reference data, description: Airports, airlines, and aircraft types. }
  - { name: Personal data, description: Preferences, visited countries, and shares. }
  - { name: Administration, description: Users and RBAC roles. }
paths:
  /api/v1:
    get:
      tags: [Discovery]
      operationId: api-v1-discovery
      security: []
      summary: Discover API capabilities
      responses:
        '200':
          description: API versions, authentication methods, MCP endpoint, and supported scopes.
          content: { application/json: { schema: { $ref: '#/components/schemas/Discovery' } } }
  /api/v1/me:
    get:
      tags: [Discovery]
      operationId: api-v1-get-me
      summary: Get the authenticated profile
      responses:
        '200':
          description: Profile, role, effective permissions, and credential scopes.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/flights:
    get:
      tags: [Flights]
      operationId: api-v1-list-flights
      summary: List visible flights
      description: >-
        Returns flights in deterministic descending order by flight date, then
        descending ID. Results are cursor-paginated. Start without a cursor,
        then pass the returned `page.nextCursor` value unchanged as `cursor`
        to fetch the next page. When `page.nextCursor` is `null`, the response
        is the last page. Cursors are opaque and must not be decoded or
        constructed by clients.
      parameters:
        - { $ref: '#/components/parameters/FlightScope' }
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Cursor-paginated flights.
          content: { application/json: { schema: { $ref: '#/components/schemas/FlightCollection' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Flights]
      operationId: api-v1-create-flight
      summary: Create a flight
      requestBody: { $ref: '#/components/requestBodies/Flight' }
      responses:
        '201':
          description: Flight created.
          content: { application/json: { schema: { $ref: '#/components/schemas/CreatedResponse' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/flights/{id}:
    parameters: [{ $ref: '#/components/parameters/FlightId' }]
    get:
      tags: [Flights]
      operationId: api-v1-get-flight
      summary: Get a visible flight
      responses:
        '200': { description: Flight details., content: { application/json: { schema: { $ref: '#/components/schemas/FlightResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Flights]
      operationId: api-v1-update-flight
      summary: Replace a flight
      requestBody: { $ref: '#/components/requestBodies/Flight' }
      responses:
        '200': { description: Updated flight., content: { application/json: { schema: { $ref: '#/components/schemas/FlightResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Flights]
      operationId: api-v1-delete-flight
      summary: Delete a flight
      responses:
        '204': { description: Flight deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/flights/{id}/track:
    parameters: [{ $ref: '#/components/parameters/FlightId' }]
    get:
      tags: [Flights]
      operationId: api-v1-get-flight-track
      summary: Get a flight track
      responses:
        '200': { description: Track or null., content: { application/json: { schema: { $ref: '#/components/schemas/TrackResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Flights]
      operationId: api-v1-set-flight-track
      summary: Replace a flight track
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrackInput' } } }
      responses:
        '200': { description: Saved track., content: { application/json: { schema: { $ref: '#/components/schemas/TrackResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Flights]
      operationId: api-v1-delete-flight-track
      summary: Delete a flight track
      responses: { '204': { description: Track deleted. } }
  /api/v1/flights/export:
    get:
      tags: [Flights]
      operationId: api-v1-export-flights
      summary: Export visible flights
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, yaml, yml], default: json } }
        - { $ref: '#/components/parameters/FlightScope' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: AirTrail backup.
          content:
            application/json: { schema: { type: object } }
            application/yaml: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/stats:
    get:
      tags: [Flights]
      operationId: api-v1-get-stats
      summary: Get flight statistics
      parameters:
        - { $ref: '#/components/parameters/FlightScope' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200': { description: Statistics., content: { application/json: { schema: { $ref: '#/components/schemas/StatsResponse' } } } }
  /api/v1/airports:
    get:
      tags: [Reference data]
      operationId: api-v1-search-airports
      summary: Search airports
      parameters: [{ $ref: '#/components/parameters/SearchQuery' }]
      responses:
        '200': { description: Matching airports., content: { application/json: { schema: { $ref: '#/components/schemas/AirportCollection' } } } }
  /api/v1/airports/{id}:
    get:
      tags: [Reference data]
      operationId: api-v1-get-airport
      summary: Get an airport
      parameters: [{ $ref: '#/components/parameters/ReferenceId' }]
      responses:
        '200': { description: Airport., content: { application/json: { schema: { $ref: '#/components/schemas/AirportResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/airlines:
    get:
      tags: [Reference data]
      operationId: api-v1-search-airlines
      summary: Search airlines
      parameters: [{ $ref: '#/components/parameters/SearchQuery' }]
      responses:
        '200': { description: Matching airlines., content: { application/json: { schema: { $ref: '#/components/schemas/AirlineCollection' } } } }
  /api/v1/airlines/{id}:
    get:
      tags: [Reference data]
      operationId: api-v1-get-airline
      summary: Get an airline
      parameters: [{ $ref: '#/components/parameters/ReferenceId' }]
      responses:
        '200': { description: Airline., content: { application/json: { schema: { $ref: '#/components/schemas/AirlineResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/aircraft:
    get:
      tags: [Reference data]
      operationId: api-v1-search-aircraft
      summary: Search aircraft types
      parameters: [{ $ref: '#/components/parameters/SearchQuery' }]
      responses:
        '200': { description: Matching aircraft types., content: { application/json: { schema: { $ref: '#/components/schemas/AircraftCollection' } } } }
  /api/v1/aircraft/{id}:
    get:
      tags: [Reference data]
      operationId: api-v1-get-aircraft
      summary: Get an aircraft type
      parameters: [{ $ref: '#/components/parameters/ReferenceId' }]
      responses:
        '200': { description: Aircraft type., content: { application/json: { schema: { $ref: '#/components/schemas/AircraftResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/custom-fields:
    get:
      tags: [Personal data]
      operationId: api-v1-list-custom-fields
      summary: List active custom-field definitions
      responses:
        '200': { description: Definitions., content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldsResponse' } } } }
  /api/v1/preferences:
    put:
      tags: [Personal data]
      operationId: api-v1-update-preferences
      summary: Update personal preferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
      responses:
        '200': { description: Preferences updated., content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedResponse' } } } }
  /api/v1/visited-countries:
    get:
      tags: [Personal data]
      operationId: api-v1-list-visited-countries
      summary: List visited countries
      responses:
        '200': { description: Visited countries., content: { application/json: { schema: { $ref: '#/components/schemas/VisitedCountriesResponse' } } } }
    put:
      tags: [Personal data]
      operationId: api-v1-set-visited-country
      summary: Set a visited country
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VisitedCountryInput' } } }
      responses:
        '200': { description: Saved country., content: { application/json: { schema: { $ref: '#/components/schemas/VisitedCountryResponse' } } } }
    delete:
      tags: [Personal data]
      operationId: api-v1-remove-visited-country
      summary: Remove a visited country
      parameters: [{ name: code, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 2 } }]
      responses: { '204': { description: Country removed. } }
  /api/v1/shares:
    get:
      tags: [Personal data]
      operationId: api-v1-list-shares
      summary: List public shares
      responses:
        '200': { description: Shares., content: { application/json: { schema: { $ref: '#/components/schemas/SharesResponse' } } } }
    post:
      tags: [Personal data]
      operationId: api-v1-create-share
      summary: Create a public share
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareInput' } } }
      responses:
        '201': { description: Created share., content: { application/json: { schema: { $ref: '#/components/schemas/ShareResponse' } } } }
  /api/v1/shares/{id}:
    parameters: [{ $ref: '#/components/parameters/ReferenceId' }]
    put:
      tags: [Personal data]
      operationId: api-v1-update-share
      summary: Replace a public share
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareInput' } } }
      responses:
        '200': { description: Updated share., content: { application/json: { schema: { $ref: '#/components/schemas/ShareResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Personal data]
      operationId: api-v1-delete-share
      summary: Delete a public share
      responses: { '204': { description: Share deleted. }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/users:
    get:
      tags: [Administration]
      operationId: api-v1-list-users
      summary: List the user directory
      responses:
        '200': { description: Visible users., content: { application/json: { schema: { $ref: '#/components/schemas/UsersResponse' } } } }
  /api/v1/roles:
    get:
      tags: [Administration]
      operationId: api-v1-list-roles
      summary: List access roles
      responses:
        '200': { description: Roles., content: { application/json: { schema: { $ref: '#/components/schemas/RolesResponse' } } } }
    post:
      tags: [Administration]
      operationId: api-v1-create-role
      summary: Create an access role
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } }
      responses:
        '201': { description: Role created., content: { application/json: { schema: { $ref: '#/components/schemas/CreatedResponse' } } } }
  /api/v1/roles/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [Administration]
      operationId: api-v1-update-role
      summary: Replace an access role
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } }
      responses:
        '200': { description: Role updated., content: { application/json: { schema: { $ref: '#/components/schemas/UpdatedResponse' } } } }
    delete:
      tags: [Administration]
      operationId: api-v1-delete-role
      summary: Delete an access role
      responses: { '204': { description: Role deleted. } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key or OAuth 2.1 access token
      description: >-
        Send `Authorization: Bearer <credential>`. Create API keys in AirTrail
        Security settings. OAuth clients use authorization code with PKCE S256
        and a resource identifier matching `/api/v1`.
  parameters:
    FlightId: { name: id, in: path, required: true, description: Flight ID., schema: { type: integer, minimum: 1 } }
    ReferenceId: { name: id, in: path, required: true, description: Resource ID., schema: { type: integer, minimum: 1 } }
    FlightScope: { name: scope, in: query, description: Flight ownership scope., schema: { type: string, enum: [mine, user, all], default: mine } }
    UserId: { name: userId, in: query, description: User ID required when scope=user., schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor:
      name: cursor
      in: query
      description: >-
        An opaque pagination cursor returned in `page.nextCursor`. Pass it
        unchanged to retrieve the next page. Omit it for the first page. A
        `null` `page.nextCursor` means there are no more pages.
      schema: { type: string }
    SearchQuery: { name: query, in: query, required: true, schema: { type: string, minLength: 1 } }
  requestBodies:
    Flight:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/FlightInput' } } }
  responses:
    BadRequest: { description: Invalid request., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized:
      description: Missing or invalid bearer credential.
      headers: { WWW-Authenticate: { description: Bearer challenge and OAuth resource metadata., schema: { type: string } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden: { description: Current RBAC authority or credential scope is insufficient., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found or not visible., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: Request validation failed., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, conflict, forbidden, insufficient_scope, internal_error, invalid_json, not_found, unauthorized, validation_failed] }
            message: { type: string }
            details: { type: array, items: { type: object, additionalProperties: true } }
    Discovery:
      type: object
      required: [api, instance, authentication, mcp, scopes]
      properties:
        api: { type: object, additionalProperties: true }
        instance: { type: object, additionalProperties: true }
        authentication: { type: object, additionalProperties: true }
        mcp: { type: object, additionalProperties: true }
        scopes: { type: array, items: { type: object, required: [name, description], properties: { name: { type: string }, description: { type: string } } } }
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: >-
            The opaque cursor for the next page. Send this value as the
            `cursor` query parameter. `null` indicates the last page.
    User:
      type: object
      required: [id, username, displayName]
      properties: { id: { type: string }, username: { type: string }, displayName: { type: string } }
    Profile:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [role, isOwner, permissions, credential]
          properties:
            role: { type: [object, 'null'], properties: { id: { type: [string, 'null'] }, name: { type: string } } }
            isOwner: { type: boolean }
            permissions: { type: array, items: { type: string } }
            credential: { type: object, required: [kind, scopes], properties: { kind: { type: string, enum: [apiKey, oauth] }, scopes: { type: array, items: { type: string } } } }
    ProfileResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Profile' } } }
    Airport:
      type: object
      required: [id, icao, iata, name, municipality, latitude, longitude, timezone, type, continent, country, custom]
      properties:
        id: { type: integer }
        icao: { type: string }
        iata: { type: [string, 'null'] }
        name: { type: string }
        municipality: { type: [string, 'null'] }
        latitude: { type: number }
        longitude: { type: number }
        timezone: { type: string }
        type: { type: string, enum: [small_airport, medium_airport, large_airport, heliport, balloonport, seaplane_base, closed] }
        continent: { type: string, enum: [AF, AS, EU, NA, OC, SA, AN] }
        country: { type: string }
        custom: { type: boolean }
    Airline:
      type: object
      required: [id, name, icao, iata, iconPath]
      properties: { id: { type: integer }, name: { type: string }, icao: { type: [string, 'null'] }, iata: { type: [string, 'null'] }, iconPath: { type: [string, 'null'] } }
    Aircraft:
      type: object
      required: [id, name, icao]
      properties: { id: { type: integer }, name: { type: string }, icao: { type: [string, 'null'] } }
    Passenger:
      type: object
      required: [id, user, guestName, seat, seatNumber, seatClass, flightReason]
      properties:
        id: { type: integer }
        user: { anyOf: [{ $ref: '#/components/schemas/User' }, { type: 'null' }] }
        guestName: { type: [string, 'null'] }
        seat: { type: [string, 'null'], enum: [window, aisle, middle, pilot, copilot, jumpseat, other, null] }
        seatNumber: { type: [string, 'null'] }
        seatClass: { type: [string, 'null'], enum: [economy, economy+, business, first, private, null] }
        flightReason: { type: [string, 'null'], enum: [leisure, business, crew, other, null] }
    PassengerInput:
      type: object
      description: Exactly one of userId and guestName is required.
      properties:
        id: { type: integer, minimum: 1 }
        userId: { type: [string, 'null'] }
        guestName: { type: [string, 'null'], maxLength: 100 }
        seat: { type: [string, 'null'], enum: [window, aisle, middle, pilot, copilot, jumpseat, other, null] }
        seatNumber: { type: [string, 'null'], maxLength: 20 }
        seatClass: { type: [string, 'null'], enum: [economy, economy+, business, first, private, null] }
        flightReason: { type: [string, 'null'], enum: [leisure, business, crew, other, null] }
        customFields: { type: object, additionalProperties: true }
    TrackSummary:
      type: object
      required: [pointCount, updatedAt, sourceFormat, sourceName]
      properties: { pointCount: { type: integer }, updatedAt: { type: string, format: date-time }, sourceFormat: { type: string }, sourceName: { type: [string, 'null'] } }
    TrackInput:
      type: object
      required: [coordinates, sourceFormat]
      properties:
        coordinates: { type: array, minItems: 2, maxItems: 100000, items: { type: array, minItems: 2, maxItems: 3, items: { type: number } } }
        sourceFormat: { type: string, enum: [gpx, kml, csv, readsb] }
        sourceName: { type: [string, 'null'], maxLength: 255 }
        times: { type: array, items: { type: integer } }
        groundSpeedKt: { type: array, items: { type: number } }
        trackDeg: { type: array, items: { type: number } }
        ground: { type: array, items: { type: boolean } }
        estimated: { type: array, items: { type: boolean } }
    Track:
      allOf:
        - { $ref: '#/components/schemas/TrackInput' }
        - type: object
          required: [flightId, pointCount, createdAt, updatedAt]
          properties: { flightId: { type: integer }, pointCount: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    Flight:
      type: object
      required: [id, date, datePrecision, passengers]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        datePrecision: { type: string, enum: [day, month, year] }
        departure: { type: [string, 'null'], format: date-time }
        arrival: { type: [string, 'null'], format: date-time }
        departureScheduled: { type: [string, 'null'], format: date-time }
        arrivalScheduled: { type: [string, 'null'], format: date-time }
        takeoffScheduled: { type: [string, 'null'], format: date-time }
        takeoffActual: { type: [string, 'null'], format: date-time }
        landingScheduled: { type: [string, 'null'], format: date-time }
        landingActual: { type: [string, 'null'], format: date-time }
        duration: { type: [integer, 'null'] }
        departureTerminal: { type: [string, 'null'] }
        departureGate: { type: [string, 'null'] }
        arrivalTerminal: { type: [string, 'null'] }
        arrivalGate: { type: [string, 'null'] }
        flightNumber: { type: [string, 'null'] }
        aircraftReg: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        from: { anyOf: [{ $ref: '#/components/schemas/Airport' }, { type: 'null' }] }
        to: { anyOf: [{ $ref: '#/components/schemas/Airport' }, { type: 'null' }] }
        airline: { anyOf: [{ $ref: '#/components/schemas/Airline' }, { type: 'null' }] }
        aircraft: { anyOf: [{ $ref: '#/components/schemas/Aircraft' }, { type: 'null' }] }
        passengers: { type: array, items: { $ref: '#/components/schemas/Passenger' } }
        track: { anyOf: [{ $ref: '#/components/schemas/TrackSummary' }, { type: 'null' }] }
    FlightInput:
      type: object
      required: [date, fromId, toId, passengers]
      properties:
        date: { type: string, format: date }
        datePrecision: { type: string, enum: [day, month, year], default: day }
        departure: { type: [string, 'null'], format: date-time }
        arrival: { type: [string, 'null'], format: date-time }
        departureScheduled: { type: [string, 'null'], format: date-time }
        arrivalScheduled: { type: [string, 'null'], format: date-time }
        takeoffScheduled: { type: [string, 'null'], format: date-time }
        takeoffActual: { type: [string, 'null'], format: date-time }
        landingScheduled: { type: [string, 'null'], format: date-time }
        landingActual: { type: [string, 'null'], format: date-time }
        duration: { type: [integer, 'null'], minimum: 0 }
        departureTerminal: { type: [string, 'null'], maxLength: 500 }
        departureGate: { type: [string, 'null'], maxLength: 500 }
        arrivalTerminal: { type: [string, 'null'], maxLength: 500 }
        arrivalGate: { type: [string, 'null'], maxLength: 500 }
        flightNumber: { type: [string, 'null'], maxLength: 500 }
        aircraftReg: { type: [string, 'null'], maxLength: 500 }
        note: { type: [string, 'null'], maxLength: 10000 }
        fromId: { type: integer, minimum: 1 }
        toId: { type: integer, minimum: 1 }
        aircraftId: { type: [integer, 'null'], minimum: 1 }
        airlineId: { type: [integer, 'null'], minimum: 1 }
        passengers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PassengerInput' } }
        track: { anyOf: [{ $ref: '#/components/schemas/TrackInput' }, { type: 'null' }] }
        customFields: { type: object, additionalProperties: true }
    FlightResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Flight' } } }
